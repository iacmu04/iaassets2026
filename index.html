<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบรายงานสรุปครุภัณฑ์และข้อเสนอแนะ</title>
  <link href="https://fonts.googleapis.com/css2?family=TH+Sarabun+New:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-main: 'TH Sarabun New', sans-serif;
      --primary-color: #1e3a8a;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #cbd5e1;
    }

    * { box-sizing: border-box; }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-color);
      color: #0f172a;
      margin: 0;
      padding: 20px;
      font-size: 16px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Screen Control UI */
    .controls-panel {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      margin-bottom: 24px;
    }

    .controls-panel h1 {
      font-size: 24px;
      margin: 0 0 12px 0;
      color: var(--primary-color);
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    .btn {
      font-family: var(--font-main);
      font-size: 18px;
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid var(--primary-color);
      background: var(--primary-color);
      color: white;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover { background: #1e40af; }
    .btn-outline { background: transparent; color: var(--primary-color); }
    .btn-outline:hover { background: #eff6ff; }

    .select-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      padding: 8px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: #f1f5f9;
    }

    .unit-chip {
      padding: 6px 10px;
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .unit-chip.active {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    /* Printable Report Document */
    .report-paper {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin: 0 auto;
    }

    .report-title {
      font-size: 20pt !important;
      font-weight: bold;
      color: #000;
      margin: 0 0 16px 0;
      line-height: 1.3;
    }

    .section-title {
      font-size: 16pt !important;
      font-weight: bold;
      color: #000;
      margin: 20px 0 10px 0;
      line-height: 1.3;
    }

    .report-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
      font-size: 12pt !important;
      line-height: 1.5;
    }

    .report-table th, 
    .report-table td {
      border: 1px solid #000;
      padding: 6px 8px;
      vertical-align: top;
      word-wrap: break-word;
    }

    .report-table th {
      background-color: #f8fafc;
      font-weight: bold;
      text-align: center; /* หัวคอลัมน์กึ่งกลาง */
    }
